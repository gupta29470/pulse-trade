# Keeps the optional free Render instance from spinning down.
#
# Render sleeps a free service after ~15 minutes without inbound traffic, so one
# request every 5 minutes keeps it warm. That is the only job this workflow has:
# it does not build or test anything, and the build and test commands stay local.
#
# It defaults to the deployed instance, so the schedule works with no setup. Set the
# repository variable (Settings > Secrets and variables > Actions > Variables > New
# repository variable) to point it somewhere else:
#
#   PULSETRADE_URL = https://example.com
#
# The default matters for more than latency: Android fetches the app-link
# verification file when the APK is installed, and a sleeping instance can time out
# that fetch, which leaves the domain unverified and sends every https link to the
# browser instead of the app.
name: keep-alive

on:
  schedule:
    # GitHub's shortest interval. Expect delays under load: this is a fallback for
    # an external uptime monitor, not a substitute for one.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          BASE_URL: ${{ vars.PULSETRADE_URL || 'https://pulse-trade-backend.onrender.com' }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "No URL to ping."
            exit 0
          fi
          # A sleeping free instance needs time to boot, so the timeout is generous.
          # The status is reported but never fails the run: a keep-alive that mails
          # on every blip is worse than no keep-alive.
          status=$(curl -s -o /dev/null -m 90 -w '%{http_code}' "$BASE_URL/health" || echo 000)
          echo "GET $BASE_URL/health -> $status"
