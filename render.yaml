# Render blueprint for the market-data backend.
#
# Equivalent to the manual service settings, kept here so the deployment is
# reproducible. The backend lives in a subdirectory of this monorepo, which is
# what `rootDir` is for: Render builds only from there, and a change elsewhere in
# the repository does not trigger a redeploy.
#
# No secrets: the feed is generated locally and needs no exchange account or key.
services:
  - type: web
    name: pulsetrade-backend
    runtime: go
    plan: free
    rootDir: pulse_trade_backend
    # modernc.org/sqlite is pure Go, so a static binary needs no cgo.
    buildCommand: CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o app ./cmd/server
    # The server reads HTTP_ADDR, not PORT, so the port Render injects is passed
    # in here. This is the one setting that silently breaks the deploy if missed.
    startCommand: HTTP_ADDR=0.0.0.0:$PORT ./app
    envVars:
      # The version go.mod requires; drop this key if Render already ships it.
      - key: GOVERSION
        value: "1.27.1"
      # Six markets warmed on a small instance will not finish inside the server's
      # 10 s warmup budget at the default 1M events each, so it starts with a
      # partly filled chart. Raise or remove this on a larger instance.
      - key: WARMUP_MAX_EVENTS
        value: "200000"
      # Leave the debug surface reachable so a reviewer can force a delivery tier
      # against the deployed service. Set both to "false" to close it.
      - key: DEBUG_BUILD
        value: "true"
      - key: ENABLE_DEBUG_CONTROLS
        value: "true"
